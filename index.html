<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Recipeasypeasy</title>
  <meta name="theme-color" content="#2B2620" />
  <link rel="manifest" href="manifest.json" />
  <style>
    html, body { margin: 0; padding: 0; background: #FAF3E4; overflow-x: hidden; max-width: 100vw; }
    * { -webkit-tap-highlight-color: transparent; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    .hover\:-translate-y-0\.5:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // iOS Safari deliberately ignores the "user-scalable=no" meta tag for accessibility reasons,
    // so pinch-zoom can still happen (and the zoom level can persist across the session) despite
    // the meta viewport setting above. Blocking the underlying gesture/multi-touch events is the
    // only reliable way to actually stop it and keep the page filling the screen at all times.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    // Also blocks double-tap-to-zoom, which is a separate iOS gesture from pinch.
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, false);
  </script>
  <script src="bundle.js?v=20260731d"></script>
</body>
</html>
